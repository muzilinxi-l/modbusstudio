[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modbusstudio"
version = "2.0.0"
description = "Modbus Studio: 现代多从机/主机仿真工作站与 HEMS 业务数据库联调平台"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ModbusStudio Team"}
]
dependencies = [
    "pymodbus>=3.8.0",
    "pyserial>=3.5",
    "pillow>=10.0.0",
    "ttkbootstrap>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
modbusstudio = "modbusstudio.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

